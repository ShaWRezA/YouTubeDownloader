name: 🎯 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '🔄 Download Mode'
        required: true
        type: choice
        options:
          - single
          - multi
          - playlist
          - channel
          - search
        default: 'single'
      url:
        description: '🎬 URL or Search Query or channel name (@ChannelName or ChannelName) | For multi: comma-separated URLs'
        required: true
        type: string
      type:
        description: '📦 Output Type'
        required: true
        type: choice
        options:
          - video
          - audio
        default: 'video'
      quality:
        description: 'Quality (video: 144/360/480/720/1080 | audio: 128/192/320)'
        required: false
        type: string
        default: '720'
      max_videos:
        description: '🔢 Max results'
        required: false
        type: number
        default: 10
      split_method:
        description: '✂️ Split Method'
        required: true
        type: choice
        options:
          - mp4
          - zip
          - none
        default: 'mp4'
      split_threshold_mb:
        description: '📦 Split > MB (0=no)'
        required: false
        type: number
        default: 85

env:
  PYTHONUNBUFFERED: '1'
  DEBIAN_FRONTEND: 'noninteractive'

jobs:
  download-and-process:
    name: 🚀 YouTube Downloader
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}

      - name: ⚡ Setup
        run: |
          python3 -c "import requests" 2>/dev/null || pip3 install -q requests
          command -v yt-dlp &>/dev/null || pip3 install -q yt-dlp
          command -v zip &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip)
          command -v ffmpeg &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 🔗 Prepare
        id: prep
        run: |
          M="${{ github.event.inputs.mode }}"
          U="${{ github.event.inputs.url }}"
          [[ "$M" == "channel" && "$U" != http* ]] && U="https://www.youtube.com/$([[ "$U" == @* ]] && echo "$U" || echo "@$U")"
          echo "URL=$U" >> $GITHUB_OUTPUT
          echo "MODE=$M" >> $GITHUB_OUTPUT

      - name: 🎯 Download & Process
        id: main
        env:
          MODE: ${{ steps.prep.outputs.MODE }}
          URL: ${{ steps.prep.outputs.URL }}
          TYPE: ${{ github.event.inputs.type }}
          QUALITY: ${{ github.event.inputs.quality }}
          MAX: ${{ github.event.inputs.max_videos }}
          SPLIT: ${{ github.event.inputs.split_threshold_mb }}
          SPLIT_METHOD: ${{ github.event.inputs.split_method }}
        run: |
          python3 << 'PYEOF'
          import os, json, time, re, subprocess, sys, hashlib
          import requests as rq
          from pathlib import Path
          from datetime import datetime

          M = os.environ['MODE']
          U = os.environ['URL']
          T = os.environ['TYPE']
          Q = os.environ.get('QUALITY', '720')
          MX = int(os.environ.get('MAX', '10'))
          SP = int(os.environ.get('SPLIT', '50'))
          SPLIT_METHOD = os.environ.get('SPLIT_METHOD', 'zip')

          API = 'https://hub.ytconvert.org/api/download'
          H = {
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'application/json',
              'Referer': 'https://media.ytmp3.gg/',
              'Content-Type': 'application/json',
              'Origin': 'https://media.ytmp3.gg'
          }

          def safe_name(text, maxlen=40):
              safe = re.sub(r'[^\w]', '_', text)[:maxlen]
              safe = re.sub(r'_+', '_', safe).strip('_')
              if not safe:
                  safe = hashlib.md5(text.encode()).hexdigest()[:8]
              return safe

          def fm(n):
              if not n: return 'N/A'
              try:
                  n = int(n)
                  return f'{n/1e6:.1f}M' if n >= 1e6 else f'{n/1e3:.1f}K' if n >= 1e3 else str(n)
              except: return str(n)

          def gv(vid):
              try:
                  r = subprocess.run(
                      ['yt-dlp', '--dump-json', '--no-warnings', '--no-check-certificate',
                       f'https://youtube.com/watch?v={vid}'],
                      capture_output=True, text=True, timeout=15
                  )
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout)
                      channel = (d.get('channel') or d.get('uploader') or 
                                d.get('uploader_id') or d.get('creator') or 'Unknown')
                      views = d.get('view_count')
                      duration = d.get('duration', 0)
                      channel_url = d.get('channel_url', '') or d.get('uploader_url', '')
                      handle = None
                      if channel_url:
                          m = re.search(r'@([\w-]+)', channel_url)
                          if m: handle = m.group(1)
                      if not handle:
                          handle = safe_name(channel, 30) if channel and channel != 'Unknown' else None
                      return (channel.strip() if channel else 'Unknown', views, int(duration) if duration else 0, handle)
              except:
                  pass
              return ('Unknown', None, 0, None)

          def get_channel_from_url(url):
              m = re.search(r'@([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'channel/([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'c/([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'user/([\w-]+)', url)
              if m: return m.group(1)
              return None

          def get_channel_from_playlist(playlist_url):
              try:
                  cmd = ['yt-dlp', '--flat-playlist', '--dump-json', '--playlist-end', '1',
                         '--no-warnings', '--no-check-certificate', playlist_url]
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=15)
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout.strip().split('\n')[0])
                      vid = d.get('id', '')
                      if vid:
                          _, _, _, handle = gv(vid)
                          if handle: return handle
                      ch = d.get('channel') or d.get('uploader') or d.get('uploader_id')
                      if ch: return safe_name(ch, 30)
              except:
                  pass
              return None

          def gvl(u, n):
              channel_folder = get_channel_from_url(u)
              if not channel_folder and 'playlist' in u:
                  print(f'   🔍 Detecting channel from playlist...')
                  channel_folder = get_channel_from_playlist(u)
              if not channel_folder:
                  channel_folder = 'playlist_videos'

              print(f'   📁 Folder: {channel_folder}_videos')

              c = ['yt-dlp', '--flat-playlist', '--dump-json', '--no-warnings', '--no-check-certificate']
              if n > 0:
                  c.extend(['--playlist-end', str(n)])
              c.append(u)
              r = subprocess.run(c, capture_output=True, text=True, timeout=30)
              v = []
              for line in r.stdout.strip().split('\n'):
                  if line and len(v) < n:
                      try:
                          d = json.loads(line)
                          vid = d.get('id', '')
                          if not vid:
                              continue

                          title = d.get('title', 'Untitled')[:60]
                          print(f'   📊 [{len(v)+1}/{n}] {title}...')

                          ch, vw, dr, _ = gv(vid)

                          if not ch or ch == 'Unknown':
                              ch = (d.get('channel') or d.get('uploader') or
                                    d.get('uploader_id') or d.get('creator') or 'Unknown')
                          if not vw:
                              vw = d.get('view_count')
                          if not dr:
                              dr = d.get('duration', 0)

                          v.append({
                              'id': vid, 't': title,
                              'u': f'https://youtube.com/watch?v={vid}',
                              'dr': int(dr) if dr else 0,
                              'th': f'https://i.ytimg.com/vi/{vid}/maxresdefault.jpg',
                              'c': str(ch).strip() if ch else 'Unknown',
                              'v': fm(vw)
                          })
                      except Exception as e:
                          print(f'      ⚠️ Skip: {str(e)[:40]}')
                          continue

              return v, channel_folder

          def mkidx(v, cn, cd):
              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              Path('./playlists').mkdir(exist_ok=True)
              inf = cd / 'info'
              inf.mkdir(parents=True, exist_ok=True)
              idxf = f'playlists/{cn}_{ts}.md'

              m = (f'# 📺 {cn}\n\n**{datetime.now():%Y-%m-%d %H:%M}** | **{len(v)} videos**\n\n'
                   f'| # | Thumbnail | Title | Duration | Views |\n'
                   f'|---|-----------|-------|----------|-------|\n')
              for i, x in enumerate(v, 1):
                  dur_str = f'{x["dr"]//60}:{x["dr"]%60:02d}' if x['dr'] else '?'
                  m += f'| {i} | [<img src="{x["th"]}" width="80">]({x["u"]}) | [{x["t"]}]({x["u"]}) | {dur_str} | {x["v"]} |\n'

              m += '\n---\n\n## 📝 Details\n\n'
              for i, x in enumerate(v, 1):
                  sn = f'v{i:03d}_{x["id"]}'
                  dur_str = f'{x["dr"]//60} minutes' if x['dr'] else 'Unknown'
                  info_md = (f'# 🎬 {x["t"]}\n\n'
                            f'![Thumbnail]({x["th"]})\n\n'
                            f'## Info\n\n'
                            f'| Property | Value |\n|----------|-------|\n'
                            f'| **Channel** | {x["c"]} |\n'
                            f'| **Duration** | {dur_str} |\n'
                            f'| **Views** | {x["v"]} |\n'
                            f'| **Video ID** | `{x["id"]}` |\n'
                            f'| **URL** | {x["u"]} |\n\n'
                            f'## Thumbnail\n\n'
                            f'<img src="{x["th"]}" width="640">\n\n'
                            f'---\n*Downloaded: {datetime.now():%Y-%m-%d %H:%M}*')
                  (inf / f'{sn}.md').write_text(info_md)
                  m += (f'### {i}. {x["t"]}\n\n'
                       f'![Thumbnail]({x["th"]})\n\n'
                       f'- **{dur_str}** | **{x["v"]}** views | **{x["c"]}**\n'
                       f'- 📄 [info/{sn}.md](info/{sn}.md)\n\n---\n\n')

              Path(idxf).write_text(m)
              print(f'📄 Index: {idxf}')
              return idxf

          def dl_video(u):
              e = 'mp3' if T == 'audio' else 'mp4'
              p = {'url': u, 'os': 'linux', 'output': {'type': 'audio' if T == 'audio' else 'video', 'format': e}}
              if T == 'audio':
                  p['audio'] = {'bitrate': f'{Q}k'}
              else:
                  p['output']['quality'] = f'{Q}p'

              for retry in range(3):
                  if retry > 0:
                      print(f'   🔄 Retry {retry}/3...')
                      time.sleep(5)
                  try:
                      rr = rq.post(API, json=p, headers=H, timeout=15)
                      if rr.status_code != 200:
                          continue
                      d = rr.json()
                      su = d.get('statusUrl')
                      if not su:
                          continue
                      print(f'   ⏳ Converting...')
                      for _ in range(60):
                          time.sleep(2)
                          try:
                              sr = rq.get(su, headers=H, timeout=10)
                              if sr.status_code == 200:
                                  sd = sr.json()
                                  st = sd.get('status', '')
                                  if st == 'completed':
                                      du = sd.get('downloadUrl')
                                      if du:
                                          return {'u': du, 'e': e}
                                  elif st in ('failed', 'error'):
                                      break
                          except:
                              continue
                  except:
                      time.sleep(2)
              return None

          def download_file(url, filepath):
              try:
                  dr = rq.get(url, headers=H, stream=True, timeout=600)
                  if dr.status_code == 200:
                      total = int(dr.headers.get('content-length', 0))
                      done = 0
                      with open(filepath, 'wb') as f:
                          for chunk in dr.iter_content(65536):
                              f.write(chunk)
                              done += len(chunk)
                              if total > 0 and done % (10 * 65536) == 0:
                                  print(f'\r   ⬇️ {done*100/total:.1f}%', end='')
                      print(f'\r   ⬇️ 100.0%')
                      return filepath.stat().st_size
              except Exception as e:
                  print(f'   ❌ Download error: {e}')
              return 0

          def split_mp4_ffmpeg(filepath, threshold_mb):
              size_mb = filepath.stat().st_size / 1e6
              if size_mb <= threshold_mb:
                  return False

              print(f'   ✂️ Splitting MP4 ({size_mb:.0f}MB) into {threshold_mb}MB segments...')

              try:
                  probe_cmd = [
                      'ffprobe', '-v', 'error', '-show_entries',
                      'format=duration', '-of', 'default=noprint_wrappers=1:nokey=1',
                      str(filepath)
                  ]
                  result = subprocess.run(probe_cmd, capture_output=True, text=True, timeout=10)
                  duration = float(result.stdout.strip())

                  segment_duration = int((duration * threshold_mb) / size_mb)

                  parent = filepath.parent
                  stem = filepath.stem
                  ext = filepath.suffix

                  split_cmd = [
                      'ffmpeg', '-i', str(filepath), '-c', 'copy', '-map', '0',
                      '-segment_time', str(segment_duration), '-f', 'segment',
                      '-reset_timestamps', '1',
                      str(parent / f'{stem}_part%03d{ext}')
                  ]

                  subprocess.run(split_cmd, capture_output=True, check=True, timeout=300)
                  filepath.unlink()

                  parts = sorted(parent.glob(f'{stem}_part*{ext}'))
                  print(f'   ✅ Split into {len(parts)} MP4 segments')
                  return True

              except Exception as e:
                  print(f'   ⚠️ MP4 split failed: {e}')
                  return False

          def split_file(filepath, threshold_mb, method='zip'):
              if method == 'none' or threshold_mb <= 0:
                  return False

              size_mb = filepath.stat().st_size / 1e6
              if size_mb <= threshold_mb:
                  return False

              if method == 'mp4' and filepath.suffix.lower() in ['.mp4', '.mkv', '.avi', '.mov']:
                  return split_mp4_ffmpeg(filepath, threshold_mb)
              elif method == 'zip':
                  print(f'   ✂️ Splitting ({size_mb:.0f}MB) into {threshold_mb}MB ZIP parts...')
                  parent = filepath.parent
                  name = filepath.name
                  try:
                      subprocess.run(
                          ['zip', '-r', '-q', '-s', f'{threshold_mb}m', f'{name}.zip', name],
                          cwd=parent, check=True, timeout=300
                      )
                      filepath.unlink()
                      parts = sorted(parent.glob(f'{name}.z*'))
                      print(f'   ✅ Split into {len(parts)} ZIP parts')
                      return True
                  except Exception as e:
                      print(f'   ⚠️ ZIP split failed: {e}')
                      return False

              return False

          print(f'{"="*50}')
          print(f'🎬 {M.upper()} MODE')
          print(f'{"="*50}')

          if M == 'multi':
              urls = [u.strip() for u in U.split(',') if u.strip()]
              if not urls:
                  print('❌ No valid URLs provided')
                  sys.exit(1)

              print(f'\n📥 Multi-download mode: {len(urls)} URLs\n{"="*50}')

              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              cd = Path(f'downloads/multi_{ts}')
              cd.mkdir(parents=True, exist_ok=True)

              ok, fl = [], []

              for i, url in enumerate(urls, 1):
                  print(f'\n📥 [{i}/{len(urls)}] Processing: {url[:60]}...')

                  vid_match = re.search(r'(?:v=|/)([\w-]{11})', url)
                  vid = vid_match.group(1) if vid_match else f'video_{i}'

                  ch, vw, dr, handle = gv(vid)
                  title = f'Video_{i}'

                  try:
                      info_cmd = ['yt-dlp', '--get-title', '--no-warnings', url]
                      r = subprocess.run(info_cmd, capture_output=True, text=True, timeout=10)
                      if r.returncode == 0 and r.stdout.strip():
                          title = r.stdout.strip()[:60]
                  except:
                      pass

                  print(f'   Title: {title}')
                  print(f'   Channel: {ch} | Duration: {dr//60}m | Views: {fm(vw)}')

                  result = dl_video(url)
                  if result:
                      safe_title = safe_name(title, 40)
                      fp = cd / f'{i:03d}_{safe_title}_{vid}.{result["e"]}'
                      size = download_file(result['u'], fp)
                      if size:
                          print(f'   ✅ Downloaded ({size/1e6:.1f}MB)')
                          split_file(fp, SP, SPLIT_METHOD)
                          ok.append(title)
                      else:
                          print(f'   ❌ Download failed')
                          fl.append(title)
                  else:
                      print(f'   ❌ Conversion failed')
                      fl.append(title)

                  if i < len(urls):
                      print(f'   ⏳ Waiting...')
                      time.sleep(2)

              Path('./multi').mkdir(exist_ok=True)
              idx = f'multi/multi_{ts}.md'
              m = (f'# 📥 Multi Download\n\n'
                   f'**{datetime.now():%Y-%m-%d %H:%M}** | **{len(urls)} videos**\n\n'
                   f'## ✅ Successful ({len(ok)})\n\n')
              for t in ok:
                  m += f'- {t}\n'
              if fl:
                  m += f'\n## ❌ Failed ({len(fl)})\n\n'
                  for t in fl:
                      m += f'- {t}\n'
              Path(idx).write_text(m)

              Path('/tmp/meta.json').write_text(json.dumps({
                  'm': 'multi', 'cd': str(cd), 'ok': len(ok), 'fl': len(fl), 'total': len(urls)
              }))

              print(f'\n{"="*50}')
              print(f'📊 {len(ok)}/{len(urls)} downloaded successfully')
              if fl:
                  print(f'❌ Failed: {fl}')
              print(f'{"="*50}')

          elif M == 'search':
              v, _ = gvl(f'ytsearch{MX}:{U}', MX)
              if not v:
                  print('❌ No results')
                  sys.exit(1)
              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              Path('./searches').mkdir(exist_ok=True)
              qs = safe_name(U, 30)
              f = f'searches/{qs}_{ts}.md'
              m = (f'# 🔍 Search: {U}\n\n**{datetime.now():%Y-%m-%d %H:%M}** | **{len(v)} results**\n\n'
                   f'| # | Thumbnail | Title | Channel | Views | Duration |\n'
                   f'|---|-----------|-------|---------|-------|----------|\n')
              for i, x in enumerate(v, 1):
                  m += f'| {i} | [<img src="{x["th"]}" width="80">]({x["u"]}) | [{x["t"]}]({x["u"]}) | {x["c"][:20]} | {x["v"]} | {x["dr"]//60}m |\n'
              m += '\n---\n\n'
              for i, x in enumerate(v, 1):
                  m += (f'### {i}. {x["t"]}\n\n<img src="{x["th"]}" width="640">\n\n'
                       f'| Property | Value |\n|----------|-------|\n'
                       f'| Channel | {x["c"]} |\n| Duration | {x["dr"]//60}m |\n'
                       f'| Views | {x["v"]} |\n| ID | `{x["id"]}` |\n| URL | {x["u"]} |\n\n---\n\n')
              Path(f).write_text(m)
              Path('/tmp/meta.json').write_text(json.dumps({'m': 'search', 'ok': 0}))
              print(f'✅ {f}')

          elif M in ('playlist', 'channel'):
              print(f'\n📋 Extracting videos...')
              v, cn = gvl(U, MX)
              if not v:
                  print('❌ No videos found')
                  sys.exit(1)

              cd = Path(f'downloads/{cn}_videos')
              cd.mkdir(parents=True, exist_ok=True)

              print(f'\n📝 Creating index...')
              mkidx(v, cn, cd)

              ok, fl = [], []
              print(f'\n📥 Downloading {len(v)} videos...\n{"="*50}')

              for i, x in enumerate(v, 1):
                  print(f'\n📥 [{i}/{len(v)}] {x["t"]}')
                  print(f'   Channel: {x["c"]} | Duration: {x["dr"]//60}m | Views: {x["v"]}')

                  result = dl_video(x['u'])
                  if result:
                      fp = cd / f'v{i:03d}_{x["id"]}.{result["e"]}'
                      size = download_file(result['u'], fp)
                      if size:
                          print(f'   ✅ Downloaded ({size/1e6:.1f}MB)')
                          split_file(fp, SP, SPLIT_METHOD)
                          ok.append(x['t'])
                      else:
                          print(f'   ❌ Download failed')
                          fl.append(x['t'])
                  else:
                      print(f'   ❌ Conversion failed')
                      fl.append(x['t'])

                  if i < len(v):
                      print(f'   ⏳ Waiting...')
                      time.sleep(2)

              Path('/tmp/meta.json').write_text(json.dumps({
                  'm': M, 'cd': str(cd), 'ok': len(ok), 'fl': len(fl), 'total': len(v)
              }))

              print(f'\n{"="*50}')
              print(f'📊 {len(ok)}/{len(v)} downloaded successfully')
              if fl:
                  print(f'❌ Failed: {fl[:5]}')
              print(f'{"="*50}')

          else:
              print(f'\n📥 Single video mode\n{"="*50}')

              vid_match = re.search(r'(?:v=|/)([\w-]{11})', U)
              vid = vid_match.group(1) if vid_match else 'single_video'

              ch, vw, dr, handle = gv(vid)
              title = 'Single Video'

              try:
                  info_cmd = ['yt-dlp', '--dump-json', '--no-warnings', '--no-check-certificate', U]
                  r = subprocess.run(info_cmd, capture_output=True, text=True, timeout=20)
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout)
                      title = d.get('title', title)[:80]
                      ch = d.get('channel') or d.get('uploader') or ch or 'Unknown'
                      vw = d.get('view_count') or vw
                      dr = d.get('duration') or dr
              except:
                  pass

              print(f'   Title: {title}')
              print(f'   Channel: {ch}')
              print(f'   Duration: {dr//60}m' if dr else '   Duration: Unknown')
              print(f'   Views: {fm(vw)}')

              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              folder_name = safe_name(handle or ch or 'single', 30)
              cd = Path(f'downloads/{folder_name}_single_{ts}')
              cd.mkdir(parents=True, exist_ok=True)

              result = dl_video(U)
              if not result:
                  print('❌ Conversion failed')
                  sys.exit(1)

              safe_title = safe_name(title, 50)
              fp = cd / f'{safe_title}_{vid}.{result["e"]}'
              size = download_file(result['u'], fp)
              if not size:
                  print('❌ Download failed')
                  sys.exit(1)

              print(f'   ✅ Downloaded ({size/1e6:.1f}MB)')
              split_file(fp, SP, SPLIT_METHOD)

              Path('./singles').mkdir(exist_ok=True)
              mdfile = f'singles/{safe_title}_{ts}.md'
              thumb = f'https://i.ytimg.com/vi/{vid}/maxresdefault.jpg'
              dur_str = f'{dr//60}:{dr%60:02d}' if dr else 'Unknown'
              md = (f'# 🎬 {title}\n\n'
                    f'![Thumbnail]({thumb})\n\n'
                    f'| Property | Value |\n'
                    f'|----------|-------|\n'
                    f'| Channel | {ch} |\n'
                    f'| Duration | {dur_str} |\n'
                    f'| Views | {fm(vw)} |\n'
                    f'| Video ID | `{vid}` |\n'
                    f'| URL | {U} |\n'
                    f'| Type | {T} |\n'
                    f'| Quality | {Q} |\n\n'
                    f'---\n'
                    f'*Downloaded: {datetime.now():%Y-%m-%d %H:%M}*')
              Path(mdfile).write_text(md)

              Path('/tmp/meta.json').write_text(json.dumps({
                  'm': 'single', 'cd': str(cd), 'ok': 1, 'fl': 0, 'total': 1, 'md': mdfile
              }))

              print(f'\n{"="*50}')
              print('📊 1/1 downloaded successfully')
              print(f'📄 Info: {mdfile}')
              print(f'{"="*50}')
          PYEOF

      - name: 📤 Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add only existing directories
          [ -d downloads ] && git add downloads || true
          [ -d playlists ] && git add playlists || true
          [ -d searches ] && git add searches || true
          [ -d singles ] && git add singles || true
          [ -d multi ] && git add multi || true
          
          if ! git diff --cached --quiet; then
            git commit -m "🎬 Add downloaded content [skip ci]"
            git push
          else
            echo "Nothing to commit"
          fi
